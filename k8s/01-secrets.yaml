# Secrets for database credentials and the JWT signing key.
# NOTE: stringData values are plain text here for learning convenience.
# In a real cluster, generate these with `kubectl create secret` or a
# secrets manager (e.g., AWS Secrets Manager / External Secrets Operator)
# and never commit them to source control.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: three-tier
type: Opaque
stringData:
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: apppassword
  POSTGRES_DB: appdb
  JWT_SECRET: change-me-in-production
  DEMO_USER: admin
  DEMO_PASSWORD: password123
