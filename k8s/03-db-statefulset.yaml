# PostgreSQL as a StatefulSet so storage persists across pod restarts.
# A headless Service gives the pod a stable network identity.
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: three-tier
  labels:
    app: db
spec:
  clusterIP: None        # headless service for the StatefulSet
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: three-tier
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          # Built image with the schema baked in (database/Dockerfile).
          # Rendered from placeholders by scripts/build-and-push.sh.
          image: __REGISTRY__/three-tier-database:__TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_DB }
            # Keep PGDATA in a subdirectory so the init scripts run correctly.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 15
            periodSeconds: 10
      # Private-registry pull secret (delete for public images; not needed on
      # EKS with IAM-based pulls). See README section 4.
      imagePullSecrets:
        - name: regcred
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
