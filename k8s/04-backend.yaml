# Backend Deployment + Service.
# The image reference uses placeholders that `scripts/build-and-push.sh`
# fills in (REGISTRY + TAG), producing a deployable manifest under
# k8s-rendered/. imagePullPolicy is Always so the cluster pulls the
# pushed image from the registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: three-tier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ganapathivarma/three-tier-backend:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_DB }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: app-secrets, key: JWT_SECRET }
            - name: DEMO_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: DEMO_USER }
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: DEMO_PASSWORD }
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: three-tier
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
