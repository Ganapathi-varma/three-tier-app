# Frontend Deployment + Service.
# The nginx image proxies /api/ to the backend Service via BACKEND_URL.
# Image reference uses placeholders filled in by scripts/build-and-push.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: three-tier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ganapathivarma/three-tier-frontend:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            # Point nginx at the in-cluster backend Service.
            - name: BACKEND_URL
              value: http://backend:3000
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: three-tier
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080   # reachable on <node-ip>:30080
