<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3-Tier Demo — Product Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Product Manager</h1>

    <!-- Login panel: shown when the user is not authenticated. -->
    <section id="login-panel" class="panel">
      <h2>Login</h2>
      <form id="login-form" aria-label="Login form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button type="submit">Log in</button>
      </form>
      <p class="hint">Demo credentials: <code>admin</code> / <code>password123</code></p>
      <p id="login-error" class="error" role="alert"></p>
    </section>

    <!-- App panel: shown after a successful login. -->
    <section id="app-panel" class="panel hidden">
      <div class="toolbar">
        <span>Signed in as <strong id="current-user"></strong></span>
        <button id="logout-btn" type="button" class="secondary">Log out</button>
      </div>

      <h2 id="form-title">Add product</h2>
      <form id="product-form" aria-label="Product form">
        <input type="hidden" id="product-id" />

        <label for="name">Name</label>
        <input id="name" name="name" type="text" required />

        <label for="description">Description</label>
        <input id="description" name="description" type="text" />

        <label for="price">Price</label>
        <input id="price" name="price" type="number" step="0.01" min="0" required />

        <div class="form-actions">
          <button type="submit" id="save-btn">Save</button>
          <button type="button" id="cancel-btn" class="secondary hidden">Cancel</button>
        </div>
      </form>
      <p id="product-error" class="error" role="alert"></p>

      <h2>Products</h2>
      <table id="products-table">
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>Description</th><th>Price</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="products-body"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
